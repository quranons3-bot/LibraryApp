<style>

.wrap { max-width: 1000px; margin: 0 auto; padding-inline: 16px; }

/* Content */
main.wrap { padding-top: 18px; padding-bottom: 60px; }
.section { margin-bottom: 28px; }
.section-head { display: flex; align-items: baseline; gap: 10px; margin: 0 2px 10px; flex-wrap: wrap; }

.ftile .i { width: 22px; height: 22px; }
.k-audio { --kc: var(--k-audio); } .k-pdf { --kc: var(--k-pdf); } .k-ppt { --kc: var(--k-ppt); } .k-video { --kc: var(--k-video); }

.finfo { min-width: 0; flex: 1; display: flex; flex-direction: column; }

.speed { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 16px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-2); }

.speed button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.app-file { text-align: center; width: min(480px, 100%); }
.app-file .ftile { width: 96px; height: 96px; border-radius: 26px; margin: 0 auto 18px; }

.image-view { max-width: 100%; max-height: calc(100vh - 120px); border-radius: 8px; box-shadow: var(--shadow); }

.toasts { position: fixed; inset-inline: 0; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 80; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 12px; }

.modal .mark { width: 54px; height: 54px; border-radius: 16px; margin-bottom: 12px; }

}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  const lockAvailable = () => (canRemember || !!APP) && HAS_CRYPTO;
  const IS_ANDROID = /Android/i.test(navigator.userAgent);
  const IS_WINDOWS = /Windows/i.test(navigator.userAgent);
  const HELPER_FILES = ['open-helper.ps1', 'install-open-helper.cmd', 'uninstall-open-helper.cmd'];
  const isHelperFile = (name) => HELPER_FILES.indexOf(String(name).toLowerCase()) > -1;

  /* ---------- Remembering the folder (IndexedDB, Chrome/Edge) ---------- */
  function idb() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('school-library-local', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function idbGet(k) {
    try { const d = await idb(); return await new Promise((res) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); }
    catch (e) { return undefined; }
  }
  async function idbSet(k, v) {
    try { const d = await idb(); await new Promise((res) => { const x = d.transaction('kv', 'readwrite'); x.objectStore('kv').put(v, k); x.oncomplete = res; x.onerror = res; }); }
    catch (e) { /* can't remember: fine */ }
  }

  /* ---------- State ---------- */
  const state = {
    lang: ls.get('lang', SETTINGS.language === 'en' ? 'en' : 'ar'),
    view: 'start',             // start | scanning | main
    rootName: '',
    root: null,                // directory handle (Chrome/Edge)
    remembered: null,          // remembered handle, not yet opened
    files: [],
    scannedAt: 0,
    scanCount: 0,
    tab: ls.get('tab', 'all'),
    type: 'all',
    query: '',
    sort: ls.get('sort', 'name'),
    layout: ls.get('layout', 'folders'),
    openMode: APP ? 'apps' : ls.get('openMode', 'apps'),   // apps = device's own apps, page = inside this page
    appHasFolder: false,                    // Android app: a folder has been chosen
    helper: ls.get('helper', '') === '1',   // Windows opener helper installed on this computer
    helperFound: false,                     // helper files are in the chosen folder
    error: '',
  };
  const app = document.getElementById('app');
  const picker = document.getElementById('picker');

  function setLang(l) {
    state.lang = l === 'en' ? 'en' : 'ar';
    document.documentElement.lang = state.lang;
    document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  }
  function title() { return SETTINGS.title || state.rootName || t('appName'); }
  function applyColor() {
    const c = /^#[0-9a-f]{6}$/i.test(SETTINGS.color || '') ? SETTINGS.color : '#0F6E64';
    const s = document.documentElement.style;
    s.setProperty('--brand', c);
    const r = parseInt(c.slice(1, 3), 16), g = parseInt(c.slice(3, 5), 16), b = parseInt(c.slice(5, 7), 16);
    s.setProperty('--brand-ink', (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 > 0.62 ? '#1B2627' : '#FFFFFF');
    const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', c);
  }

  /* ---------- Reading the folder ---------- */
  let helperSeen = false;
  async function scanHandle(root, onCount) {
    const found = [];
    helperSeen = false;
    async function walk(dir, path, depth) {
      for await (const [name, h] of dir.entries()) {
        if (SKIP.test(name)) continue;
        if (h.kind === 'directory') { if (depth < 8) await walk(h, path.concat(name), depth + 1); }
        else if (path.length === 0 && isHelperFile(name)) helperSeen = true;
        else if (!(path.length === 0 && name.toLowerCase() === ownName)) { found.push({ name, path, handle: h }); if (found.length % 25 === 0) onCount(found.length); }
      }
    }
    await walk(root, [], 0);
    onCount(found.length);
    const items = [];
    for (let i = 0; i < found.length; i += 40) {
      const batch = await Promise.all(found.slice(i, i + 40).map(async (f) => {
        try {
          const file = await f.handle.getFile();
          return makeItem(f.name, f.path, file.size, file.lastModified, () => f.handle.getFile());
        } catch (e) { return null; }
      }));
      batch.forEach((x) => { if (x) items.push(x); });
    }
    return items;
  }
  function scanFileList(list) {
    const items = [];
    helperSeen = false;
    Array.from(list).forEach((file) => {
      const parts = String(file.webkitRelativePath || file.name).split('/');
      const path = parts.slice(1, -1);
      if (parts.some((p) => SKIP.test(p))) return;
      if (path.length === 0 && file.name.toLowerCase() === ownName) return;
      if (path.length === 0 && isHelperFile(file.name)) { helperSeen = true; return; }
      items.push(makeItem(file.name, path, file.size, file.lastModified, () => Promise.resolve(file)));
    });
    return items;
  }
  const baseOf = (n) => String(n || '').replace(/\.[a-z0-9]{1,5}$/i, '').toLowerCase();
  const inPage = (f) => (f.kind === 'pdf' && !IS_ANDROID) || ['audio', 'video'].indexOf(f.kind) > -1 || (f.kind === 'image' && extOf(f.name) !== 'heic') || ['txt', 'csv'].indexOf(extOf(f.name)) > -1;
  // A PowerPoint/Word file with a PDF of the same name next to it is shown once, and opens as that PDF.
  function pairTwins(items) {
    const pdfs = new Map();
    items.forEach((f) => { if (f.kind === 'pdf') pdfs.set(f.path.join('/') + '/' + baseOf(f.name), f); });
    const hide = new Set();
    items.forEach((f) => {
      if (f.kind !== 'ppt' && f.kind !== 'doc') return;
      if (['txt', 'csv'].indexOf(extOf(f.name)) > -1) return;
      const tw = pdfs.get(f.path.join('/') + '/' + baseOf(f.name));
      if (tw) { f.twin = tw; hide.add(tw); }
    });
    return items.filter((f) => !hide.has(f));
  }
  function appLabel(f) {
    const e = extOf(f.name);
    if (f.kind === 'ppt') return e === 'key' ? 'Keynote' : 'PowerPoint';
    if (e === 'doc' || e === 'docx' || e === 'rtf' || e === 'odt') return 'Word';
    if (e === 'xls' || e === 'xlsx' || e === 'ods') return 'Excel';
    return t('theApp');
  }
  function makeItem(name, path, size, modified, getFile) {
    return {
      id: path.concat(name).join('/'),
      name, path, size, modified, getFile,
      section: path[0] || '',
      group: path.slice(1).join(' / '),
      kind: kindOf(name),
    };
  }

  async function openHandle(handle, quiet) {
    state.root = handle;
    state.rootName = handle.name;
    if (!quiet) { state.view = 'scanning'; state.scanCount = 0; render(); }
    try {
      const items = await scanHandle(handle, (n) => { state.scanCount = n; const el = document.getElementById('scan-count'); if (el) el.textContent = t('found', t('files', n)); });
      state.files = pairTwins(items);
      state.helperFound = helperSeen;
      state.scannedAt = Date.now();
      state.view = 'main';
      if (quiet) { renderTabs(); renderContent(); } else render();
      return true;
    } catch (e) {
      console.warn(e);
      state.root = null;
      state.view = 'start';
      state.error = e && e.name === 'NotFoundError' ? t('folderGone') : t('permissionDenied');
      render();
      return false;
    }
  }

  /* ---------- Android app bridge ---------- */
  const appWaiting = new Map();
  let appSeq = 0;
  function appCall(method, ...args) {
    return new Promise((resolve) => {
      const id = 'c' + (++appSeq);
      appWaiting.set(id, (text) => { try { resolve(JSON.parse(text)); } catch (e) { resolve({ ok: false, error: 'bad_reply' }); } });
      try { APP[method](id, ...args); } catch (e) { appWaiting.delete(id); resolve({ ok: false, error: 'bridge' }); }
    });
  }
  window.__libraryApp = {
    resolve(id, text) { const f = appWaiting.get(id); if (f) { appWaiting.delete(id); f(text); } },
    // Android back button: close whatever is open; false = leave the app.
    back() {
      const cancel = document.querySelector('.modal-backdrop [data-pin="cancel"]');
      if (cancel) { cancel.click(); return true; }
      if (popEl) { closeSettings(); return true; }
      const tip = document.getElementById('tip');
      if (tip && tip.innerHTML) { tip.innerHTML = ''; return true; }
      if (viewer) { closeViewer(); return true; }
      return false;
    },
    refresh() { autoRefresh(); },
  };

  async function openAppFolder(quiet) {
    if (!quiet) { state.view = 'scanning'; state.scanCount = 0; render(); }
    const r = await appCall('listFiles');
    if (!r.ok) {
      state.appHasFolder = false;
      state.files = [];
      state.view = 'start';
      state.error = r.error === 'no_folder' ? '' : t('folderGone');
      render();
      return false;
    }
    state.appHasFolder = true;
    state.rootName = r.name || t('appName');
    const items = [];
    (r.files || []).forEach((f) => {
      const parts = String(f.p || '').split('/').filter(Boolean);
      if (!parts.length || parts.some((p) => SKIP.test(p))) return;
      const name = parts[parts.length - 1];
      if (parts.length === 1 && (isHelperFile(name) || /^(school-library|index)\.html?$/i.test(name))) return;
      items.push(makeItem(name, parts.slice(0, -1), Number(f.s) || 0, Number(f.m) || 0, null));
    });
    state.files = items;
    state.scannedAt = Date.now();
    state.view = 'main';
    if (quiet) { renderTabs(); renderContent(); } else render();
    return true;
  }

  async function openInPhoneApp(item) {
    const r = await appCall('openFile', item.id);
    if (r.ok) return;
    if (r.error === 'no_app') toast(t('noAppFor', t('k_' + item.kind)));
    else if (r.error === 'not_found') { toast(t('fileGone')); rescan(false); }
    else toast(t('openFailed'));
  }

  async function chooseFolder() {
    state.error = '';
    if (APP) {
      const r = await appCall('pickFolder');
      if (r.ok) await openAppFolder();
      else if (r.error !== 'cancelled') { state.error = t('pickFailed'); render(); }
      return;
    }
    if (canRemember) {
      let h;
      try { h = await window.showDirectoryPicker({ id: 'school-library', mode: 'read' }); }
      catch (e) {
        if (e && e.name === 'AbortError') return;
        state.error = t('pickFailed'); render(); return;
      }
      await idbSet('root', h);
      state.remembered = h;
      await openHandle(h);
    } else {
      picker.value = '';
      picker.click();
    }
  }

  picker.addEventListener('change', () => {
    const list = picker.files;
    if (!list || !list.length) return;
    const first = String(list[0].webkitRelativePath || '').split('/')[0];
    state.root = null;
    state.rootName = first || t('appName');
    state.files = pairTwins(scanFileList(list));
    state.helperFound = helperSeen;
    state.scannedAt = Date.now();
    state.view = 'main';
    render();
  });

  async function openRemembered() {
    const h = state.remembered;
    if (!h) return chooseFolder();
    state.error = '';
    try {
      let p = await h.queryPermission({ mode: 'read' });
      if (p !== 'granted') p = await h.requestPermission({ mode: 'read' });
      if (p !== 'granted') { state.error = t('permissionDenied'); render(); return; }
    } catch (e) { state.error = t('folderGone'); render(); return; }
    await openHandle(h);
  }

  async function rescan(showToast) {
    if (APP) {
      if (!state.appHasFolder) { chooseFolder(); return; }
      const ok = await openAppFolder(true);
      if (ok && showToast) toast(t('updated'));
      return;
    }
    if (!state.root) { chooseFolder(); return; }
    const ok = await openHandle(state.root, true);
    if (ok && showToast) toast(t('updated'));
  }

  /* ---------- Rendering ---------- */
  function render() {
    document.title = title();
    if (state.view === 'main') renderMain();
    else if (state.view === 'scanning') renderScanning();
    else renderStart();
  }

  function langButton(cls) {
    return '<button class="' + cls + '" data-action="lang" aria-label="' + esc(t('otherLangName')) + '">' + (cls === 'btn' ? icon('globe') + esc(t('otherLangName')) : esc(t('otherLang'))) + '</button>';
  }

  function renderStart() {
    const r = state.remembered;
    app.innerHTML = '<div class="gate"><div><div class="gate-card">' +
      '<div class="mark">' + icon('book') + '</div>' +
      '<h1>' + esc(SETTINGS.title || t('chooseTitle')) + '</h1>' +
      '<p class="sub">' + esc(SETTINGS.subtitle || t('chooseBody')) + '</p>' +
      (r ? '<button class="btn primary big" data-action="open-remembered">' + icon('folderOpen') + esc(t('openRemembered', r.name)) + '</button>' +
           '<button class="btn" data-action="change-folder">' + icon(isLocked() ? 'lock' : 'folder') + esc(t('chooseOther')) + '</button>'
         : '<button class="btn primary big" data-action="choose">' + icon('folderOpen') + esc(t('chooseBtn')) + '</button>') +
      (state.error ? '<p class="error" role="alert">' + esc(state.error) + '</p>' : '') +
      '<p class="note">' + esc(APP ? t('appNote') : canRemember ? t('rememberNote') : t('noRememberNote')) + '<br>' + esc(t('pickHint')) + '</p>' +
      '</div><div class="gate-foot">' + langButton('btn') + '</div></div></div>';
  }

  function renderScanning() {
    app.innerHTML = '<div class="gate"><div class="gate-card"><div class="spinner"></div><h1 style="font-size:18px">' + esc(t('scanning')) + '</h1>' +
      '<p class="sub" id="scan-count" style="margin-bottom:0">' + esc(state.rootName) + '</p></div></div>';
  }

  function renderMain() {
    app.innerHTML =
      '<header class="hero"><div class="wrap">' +
        '<div class="hero-top">' +
          '<div class="mark">' + icon('book') + '</div>' +
          '<div class="brand-text"><h1>' + esc(title()) + '</h1><p>' + esc(SETTINGS.subtitle || t('files', state.files.length)) + '</p></div>' +
          '<button class="icon-btn" data-action="settings" title="' + esc(t('settings')) + '" aria-label="' + esc(t('settings')) + '" aria-haspopup="true">' + icon('sliders') + '</button>' +
          '<button class="icon-btn" data-action="refresh" title="' + esc(t('refresh')) + '" aria-label="' + esc(t('refresh')) + '">' + icon('refresh') + '</button>' +
          '<button class="icon-btn" data-action="change-folder" title="' + esc(isLocked() ? t('changeFolderLocked') : t('changeFolder')) + '" aria-label="' + esc(isLocked() ? t('changeFolderLocked') : t('changeFolder')) + '">' + icon(isLocked() ? 'lock' : 'folder') + '</button>' +
          langButton('icon-btn lang') +
        '</div>' +
        '<div class="search">' + icon('search') + '<input id="q" type="search" autocomplete="off" placeholder="' + esc(t('search')) + '" aria-label="' + esc(t('search')) + '" value="' + esc(state.query) + '"></div>' +
      '</div></header>' +
      '<nav class="bar"><div class="wrap"><div class="tabs" id="tabs" role="tablist"></div>' +
        '<div class="tools"><div class="types" id="types"></div>' +
          '<div class="sorts">' +
            '<label class="select">' + icon('sort') + '<span class="sr">' + esc(t('sortBy')) + ':</span><select id="sort" aria-label="' + esc(t('sortBy')) + '">' +
              ['name', 'new', 'old', 'big', 'type'].map((s) => '<option value="' + s + '"' + (state.sort === s ? ' selected' : '') + '>' + esc(t('sort_' + s)) + '</option>').join('') +
            '</select></label>' +
            '<div class="seg" role="group">' +
              '<button data-action="layout" data-layout="folders" aria-pressed="' + (state.layout === 'folders') + '" title="' + esc(t('viewFolders')) + '" aria-label="' + esc(t('viewFolders')) + '">' + icon('tree') + '</button>' +
              '<button data-action="layout" data-layout="flat" aria-pressed="' + (state.layout === 'flat') + '" title="' + esc(t('viewFlat')) + '" aria-label="' + esc(t('viewFlat')) + '">' + icon('listIcon') + '</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div></nav>' +
      '<main class="wrap"><div id="list"></div></main>';
    const q = document.getElementById('q');
    q.addEventListener('input', () => { state.query = q.value; renderContent(); });
    document.getElementById('sort').addEventListener('change', (e) => { state.sort = e.target.value; ls.set('sort', state.sort); renderContent(); });
    renderTabs();
    renderContent();
  }

  function sections() {
    const counts = new Map();
    state.files.forEach((f) => counts.set(f.section, (counts.get(f.section) || 0) + 1));
    const col = collator();
    const list = Array.from(counts.keys()).filter((s) => s).sort((a, b) => col.compare(a, b)).map((s) => ({ id: s, name: cleanName(s, true), count: counts.get(s) }));
    if (counts.has('')) list.unshift({ id: '', name: t('general'), count: counts.get('') });
    return list;
  }
  const secName = (id) => (id ? cleanName(id, true) : t('general'));
  const groupName = (g) => g.split(' / ').map((p) => cleanName(p, true)).join(' / ');

  function renderTabs() {
    const el = document.getElementById('tabs');
    if (!el) return;
    const secs = sections();
    const tabKey = (id) => 's:' + id;
    if (state.tab !== 'all' && !secs.some((s) => tabKey(s.id) === state.tab)) state.tab = 'all';
    const tab = (key, label, count) => '<button class="tab" role="tab" data-action="tab" data-tab="' + esc(key) + '" aria-selected="' + (state.tab === key) + '"><span>' + esc(label) + '</span><span class="count">' + count + '</span></button>';
    if (secs.length <= 1) { state.tab = 'all'; el.innerHTML = ''; }
    else el.innerHTML = tab('all', t('all'), state.files.length) + secs.map((s) => tab(tabKey(s.id), s.name, s.count)).join('');

    const pool = state.files.filter(inTab);
    const kinds = KIND_ORDER.filter((k) => pool.some((f) => f.kind === k));
    if (state.type !== 'all' && kinds.indexOf(state.type) === -1) state.type = 'all';
    const types = document.getElementById('types');
    types.innerHTML = kinds.length > 1
      ? '<button class="chip" data-action="type" data-type="all" aria-pressed="' + (state.type === 'all') + '">' + esc(t('allTypes')) + '</button>' +
        kinds.map((k) => '<button class="chip k-' + k + '" data-action="type" data-type="' + k + '" aria-pressed="' + (state.type === k) + '"><span class="sw"></span>' + esc(t('kp_' + k)) + '</button>').join('')
      : '';
  }

  function inTab(f) { return state.tab === 'all' || state.tab === 's:' + f.section; }

  function filtered() {
    const q = norm(state.query.trim());
    return state.files.filter((f) => {
      if (!inTab(f)) return false;
      if (state.type !== 'all' && f.kind !== state.type) return false;
      if (q && norm(cleanName(f.name) + ' ' + f.name + ' ' + f.path.join(' ')).indexOf(q) === -1) return false;
      return true;
    });
  }

  function sorter() {
    const col = collator();
    const byName = (a, b) => col.compare(a.name, b.name);
    switch (state.sort) {
      case 'new': return (a, b) => b.modified - a.modified || byName(a, b);
      case 'old': return (a, b) => a.modified - b.modified || byName(a, b);
      case 'big': return (a, b) => b.size - a.size || byName(a, b);
      case 'type': return (a, b) => KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind) || byName(a, b);
      default: return byName;
    }
  }

  function rowHtml(f, showPath) {
    const where = [f.section ? secName(f.section) : t('general')].concat(f.group ? [groupName(f.group)] : []).join(' / ');
    return '<button class="file" data-action="open" data-id="' + esc(f.id) + '">' +
      '<span class="ftile k-' + f.kind + '">' + icon(f.kind) + '</span>' +
      '<span class="finfo"><span class="fname">' + esc(cleanName(f.name)) + '</span>' +
        '<span class="fmeta">' + (showPath ? '<span class="path">' + esc(where) + '</span><span class="sep">·</span>' : '') +
        '<span>' + esc(t('k_' + f.kind)) + (f.kind === 'other' && extOf(f.name) ? ' (' + esc(extOf(f.name).toUpperCase()) + ')' : '') + '</span>' +
        '<span class="sep">·</span><bdi>' + fmtSize(f.size) + '</bdi><span class="sep">·</span><span>' + esc(fmtDate(f.modified)) + '</span>' +
        (f.twin ? '<span class="sep">·</span><span class="twin">' + esc(t('viewableHere')) + '</span>' : '') + '</span></span>' +
      (state.openMode === 'page' && (inPage(f) || f.twin) ? icon('chev', 'chev flip-rtl') : '<span title="' + esc(t('openIn', appLabel(f))) + '">' + icon('newTab', 'chev') + '</span>') +
    '</button>';
  }

  function renderContent() {
    const el = document.getElementById('list');
    if (!el) return;
    const foot = '<div class="foot">' + esc(state.rootName) + ' · ' + esc(t('files', state.files.length)) + (state.root ? ' · ' + esc(t('lastScan', fmtAgo(state.scannedAt))) : '') + '</div>';
    if (!state.files.length) { el.innerHTML = empty('folder', t('emptyFolder')) + foot; return; }
    const list = filtered();
    if (!list.length) { el.innerHTML = empty('search', t('noResults')) + foot; return; }
    const sort = sorter();
    if (state.layout === 'flat') {
      el.innerHTML = '<div class="list">' + list.slice().sort(sort).map((f) => rowHtml(f, true)).join('') + '</div>' + foot;
      return;
    }
    const col = collator();
    const secOrder = sections().map((s) => s.id);
    const bySec = new Map();
    list.forEach((f) => { if (!bySec.has(f.section)) bySec.set(f.section, []); bySec.get(f.section).push(f); });
    let html = '';
    Array.from(bySec.keys()).sort((a, b) => secOrder.indexOf(a) - secOrder.indexOf(b)).forEach((sid) => {
      const items = bySec.get(sid);
      const size = items.reduce((a, f) => a + f.size, 0);
      html += '<section class="section"><div class="section-head"><h2>' + esc(secName(sid)) + '</h2><span class="meta">' + esc(t('files', items.length)) + ' · <bdi>' + fmtSize(size) + '</bdi></span></div>';
      const groups = new Map();
      items.forEach((f) => { if (!groups.has(f.group)) groups.set(f.group, []); groups.get(f.group).push(f); });
      Array.from(groups.keys()).sort((a, b) => (a === '' ? -1 : b === '' ? 1 : col.compare(a, b))).forEach((g) => {
        if (g) html += '<div class="group-title">' + icon('folder') + '<span>' + esc(groupName(g)) + '</span></div>';
        html += '<div class="list">' + groups.get(g).sort(sort).map((f) => rowHtml(f, false)).join('') + '</div>';
      });
      html += '</section>';
    });
    el.innerHTML = html + foot;
  }
  const empty = (ic, text) => '<div class="empty"><div class="art">' + icon(ic) + '</div><p>' + esc(text) + '</p></div>';

  function toast(text) {
    const box = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = 'toast'; el.textContent = text;
    box.appendChild(el);
    while (box.children.length > 2) box.removeChild(box.firstChild);
    setTimeout(() => el.remove(), 3500);
  }

  /* ---------- Folder change lock ---------- */
  const lockData = () => { try { return JSON.parse(ls.get('lock', '') || 'null'); } catch (e) { return null; } };
  const isLocked = () => lockAvailable() && !!lockData();
  async function hashPin(pin, salt) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin));
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
  }
  let pinFails = 0, pinBlockedUntil = 0;

  // mode: 'set' (choose a new PIN) or 'check' (verify). Resolves true when done.
  function pinDialog(mode, sub) {
    return new Promise((resolve) => {
      const wrap = document.createElement('div');
      wrap.className = 'modal-backdrop';
      const setting = mode === 'set';
      wrap.innerHTML = '<form class="modal" role="dialog" aria-modal="true" autocomplete="off">' +
        '<div class="mark">' + icon('lock') + '</div>' +
        '<h2>' + esc(setting ? t('pinSetTitle') : t('pinCheckTitle')) + '</h2>' +
        '<p>' + esc(sub || (setting ? t('pinSetSub') : t('pinCheckSub'))) + '</p>' +
        '<label for="pin1">' + esc(setting ? t('pinNew') : t('pinLabel')) + '</label>' +
        '<input id="pin1" type="password" inputmode="numeric" maxlength="32" autocomplete="off">' +
        (setting ? '<label for="pin2">' + esc(t('pinAgain')) + '</label><input id="pin2" type="password" inputmode="numeric" maxlength="32" autocomplete="off">' : '') +
        '<p class="error" role="alert"></p>' +
        '<div class="row"><button type="button" class="btn" data-pin="cancel">' + esc(t('cancel')) + '</button><button type="submit" class="btn primary">' + esc(t('ok')) + '</button></div>' +
        '</form>';
      document.body.appendChild(wrap);
      const form = wrap.querySelector('form');
      const err = wrap.querySelector('.error');
      const p1 = wrap.querySelector('#pin1');
      setTimeout(() => p1.focus(), 30);
      const done = (v) => { wrap.remove(); resolve(v); };
      wrap.addEventListener('click', (e) => { if (e.target === wrap || e.target.closest('[data-pin="cancel"]')) done(false); });
      wrap.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } });
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const pin = p1.value.trim();
        if (setting) {
          if (pin.length < 4) { err.textContent = t('pinShort'); return; }
          if (pin !== wrap.querySelector('#pin2').value.trim()) { err.textContent = t('pinMismatch'); return; }
          const salt = Array.from(crypto.getRandomValues(new Uint8Array(12))).map((b) => b.toString(16).padStart(2, '0')).join('');
          ls.set('lock', JSON.stringify({ salt: salt, hash: await hashPin(pin, salt) }));
          return done(true);
        }
        const wait = Math.ceil((pinBlockedUntil - Date.now()) / 1000);
        if (wait > 0) { err.textContent = t('pinWait', wait); return; }
        const d = lockData();
        if (!d || (await hashPin(pin, d.salt)) === d.hash) { pinFails = 0; return done(true); }
        pinFails++;
        p1.value = '';
        if (pinFails >= 5) { pinBlockedUntil = Date.now() + 30000; pinFails = 0; err.textContent = t('pinWait', 30); }
        else err.textContent = t('pinWrong');
      });
    });
  }

  async function changeFolder() {
    closeSettings();
    if (isLocked() && !(await pinDialog('check'))) return;
    chooseFolder();
  }

  /* ---------- Settings ---------- */
  let popEl = null;
  function closeSettings() { if (popEl) { popEl.remove(); popEl = null; } }
  function openSettings() {
    closeSettings();
    popEl = document.createElement('div');
    const opt = (action, value, checked, title, sub, box) =>
      '<button class="opt" role="' + (box ? 'menuitemcheckbox' : 'menuitemradio') + '" data-action="' + action + '"' + (value ? ' data-mode="' + value + '"' : '') + ' aria-checked="' + checked + '">' +
      (box ? '<span class="box">' + icon('check') + '</span>' : '<span class="dot"></span>') + '<span><b>' + esc(title) + '</b><small>' + esc(sub) + '</small></span></button>';
    popEl.innerHTML = '<div class="pop-backdrop" data-action="close-settings"></div><div class="pop" role="menu">' +
      (APP ? '' : '<h3>' + esc(t('whenClick')) + '</h3>' +
        opt('set-mode', 'apps', state.openMode === 'apps', t('modeApps'), t('modeAppsSub')) +
        opt('set-mode', 'page', state.openMode === 'page', t('modePage'), t('modePageSub')) +
        (IS_WINDOWS && state.helperFound ? '<div class="sep-line"></div>' + opt('toggle-helper', '', state.helper, t('helperLabel'), t('helperSub'), true) : '')) +
      (lockAvailable() ? (APP ? '' : '<div class="sep-line"></div>') + '<div class="lock-row' + (isLocked() ? ' on' : '') + '">' + icon(isLocked() ? 'lock' : 'unlock', 'state') +
        '<div class="txt"><b>' + esc(t('lockTitle')) + '</b><small>' + esc(isLocked() ? t('lockOnSub') : t('lockOffSub')) + '</small></div>' +
        '<button class="btn small' + (isLocked() ? '' : ' primary') + '" data-action="' + (isLocked() ? 'lock-off' : 'lock-on') + '">' + esc(isLocked() ? t('lockRemove') : t('lockSet')) + '</button></div>' : '') +
      '</div>';
    document.body.appendChild(popEl);
  }

  /* ---------- Viewer ---------- */
  let viewer = null;
  function closeViewer() {
    if (!viewer) return;
    const v = viewer; viewer = null;
    v.cleanups.forEach((fn) => { try { fn(); } catch (e) { /* ignore */ } });
    v.urls.forEach((u) => URL.revokeObjectURL(u));
    v.el.remove();
    document.body.style.overflow = '';
  }
  function requestClose() { if (history.state && history.state.viewer) history.back(); else closeViewer(); }
  window.addEventListener('popstate', () => { if (viewer) closeViewer(); });

  async function openInApp(id) {
    const item = state.files.find((f) => f.id === id);
    if (!item) return;
    let file;
    try { file = await item.getFile(); }
    catch (e) { toast(t('fileGone')); rescan(false); return; }
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url; a.download = item.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    if (ls.get('tipOpen', '') === '1') toast(t('opening', cleanName(item.name)));
    else showTip(item);
  }

  function showTip(item) {
    const box = document.getElementById('tip');
    if (IS_ANDROID) {
      box.innerHTML = '<div class="tip-card" role="status"><span class="ftile k-' + item.kind + '">' + icon(item.kind) + '</span><div>' +
        '<b>' + esc(t('tipAndroidTitle')) + '</b><p>' + esc(t('tipAndroidBody')) + '</p>' +
        '<button class="btn small primary" data-action="tip-ok">' + esc(t('gotIt')) + '</button></div></div>';
      return;
    }
    box.innerHTML = '<div class="tip-card" role="status"><span class="ftile k-' + item.kind + '">' + icon(item.kind) + '</span><div>' +
      '<b>' + esc(t('tipTitle', appLabel(item))) + '</b><p>' + esc(t('tipBody')).replace('{EN}', '<bdi dir="ltr">(Always open files of this type)</bdi>') + '</p>' +
      (IS_WINDOWS && state.helperFound ? '<p>' + esc(t('tipHelperHint')) + '</p>' : '') +
      (item.kind === 'ppt' && state.openMode === 'page' ? '<p>' + esc(t('tipTwin')) + '</p>' : '') +
      '<p class="small">' + esc(t('tipCopy')) + '</p>' +
      '<button class="btn small primary" data-action="tip-ok">' + esc(t('gotIt')) + '</button></div></div>';
  }

  const useHelper = () => IS_WINDOWS && state.helper && state.helperFound;

  // Opens the original file through the Windows opener helper (schoollib: link).
  function openWithHelper(item) {
    const a = document.createElement('a');
    a.href = 'schoollib:' + encodeURIComponent(item.id);
    document.body.appendChild(a); a.click(); a.remove();
    if (ls.get('tipHelper', '') === '1') toast(t('openingApp', cleanName(item.name)));
    else {
      document.getElementById('tip').innerHTML = '<div class="tip-card" role="status"><span class="ftile k-' + item.kind + '">' + icon(item.kind) + '</span><div>' +
        '<b>' + esc(t('tipHelperTitle')) + '</b><p>' + esc(t('tipHelperBody')) + '</p>' +
        '<button class="btn small primary" data-action="tip-helper-ok">' + esc(t('gotIt')) + '</button></div></div>';
    }
  }

  async function openItem(id) {
    const item = state.files.find((f) => f.id === id);
    if (!item) return;
    if (APP) return openInPhoneApp(item);
    if (state.openMode === 'apps') return useHelper() ? openWithHelper(item) : openInApp(id);
    if (!inPage(item) && !item.twin) return openInApp(id);
    const shown = item.twin || item;
    let file;
    try { file = await shown.getFile(); }
    catch (e) { toast(t('fileGone')); rescan(false); return; }
    const type = file.type || MIME[extOf(shown.name)] || 'application/octet-stream';
    const blob = file.type ? file : new Blob([file], { type: type });

    if (viewer) { closeViewer(); history.replaceState({ viewer: id }, ''); }
    else history.pushState({ viewer: id }, '');
    const el = document.createElement('div');
    el.className = 'viewer'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
    document.body.appendChild(el);
    document.body.style.overflow = 'hidden';
    viewer = { id, el, urls: [], cleanups: [], blob, item: shown };
    const url = URL.createObjectURL(blob);
    viewer.urls.push(url);
    const where = [state.rootName].concat(item.path).join(' / ');
    el.innerHTML = '<header class="vbar">' +
      '<button class="icon-btn" data-action="close" aria-label="' + esc(t('back')) + '">' + icon('back', 'flip-rtl') + '</button>' +
      '<div class="vtitle"><b>' + esc(cleanName(item.name)) + '</b><small>' + esc(where) + ' · ' + esc(t('k_' + item.kind)) + ' · ' + fmtSize(item.size) + '</small></div>' +
      (item.twin ? '<button class="btn small" data-action="open-app" data-id="' + esc(item.id) + '">' + icon(item.kind) + esc(t('openIn', appLabel(item))) + '</button>' : '') +
      (shown.kind === 'pdf' ? '<button class="icon-btn" data-action="new-tab" title="' + esc(t('newTab')) + '" aria-label="' + esc(t('newTab')) + '">' + icon('newTab') + '</button>' : '') +
      '<button class="icon-btn" data-action="save-copy" title="' + esc(t('saveCopy')) + '" aria-label="' + esc(t('saveCopy')) + '">' + icon('download') + '</button>' +
      '</header><div class="vbody"></div>';
    const body = el.querySelector('.vbody');
    const k = shown.kind, e = extOf(shown.name);

    if (k === 'pdf') {
      body.innerHTML = '<iframe class="pdf-frame" title="' + esc(item.name) + '"></iframe>';
      body.querySelector('iframe').src = url;
    } else if (k === 'audio') {
      body.innerHTML = '<div class="vcenter"><div class="audio-view"><div class="audio-art">' + icon('audio') + '</div>' +
        '<h2>' + esc(cleanName(item.name)) + '</h2><p class="where">' + esc(secName(item.section)) + '</p>' +
        '<audio controls preload="metadata"></audio>' +
        '<div class="speed"><span>' + esc(t('speed')) + '</span>' + [0.75, 1, 1.25, 1.5, 2].map((s) => '<button data-speed="' + s + '" aria-pressed="' + (s === 1) + '">' + s + '×</button>').join('') + '</div></div></div>';
      const audio = body.querySelector('audio');
      audio.src = url;
      const key = 'pos:' + id;
      audio.addEventListener('loadedmetadata', () => { const p = Number(ls.get(key, '0')); if (p > 5 && audio.duration && p < audio.duration - 5) audio.currentTime = p; });
      let last = 0;
      audio.addEventListener('timeupdate', () => { if (Date.now() - last > 4000) { last = Date.now(); ls.set(key, String(Math.floor(audio.currentTime))); } });
      audio.addEventListener('ended', () => ls.del(key));
      audio.addEventListener('error', () => { body.querySelector('.audio-view').insertAdjacentHTML('beforeend', '<p class="where" style="margin-top:16px">' + esc(t('cantPlay')) + '</p>'); });
      body.querySelector('.speed').addEventListener('click', (ev) => {
        const b = ev.target.closest('[data-speed]'); if (!b) return;
        audio.playbackRate = Number(b.dataset.speed);
        body.querySelectorAll('[data-speed]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      });
      viewer.cleanups.push(() => { ls.set(key, String(Math.floor(audio.currentTime || 0))); audio.pause(); });
      audio.play().catch(() => {});
    } else if (k === 'video') {
      body.innerHTML = '<div class="vcenter"><video class="media-video" controls playsinline preload="metadata"></video></div>';
      const v = body.querySelector('video');
      v.src = url;
      v.onerror = () => { body.innerHTML = '<div class="vcenter"><p>' + esc(t('cantPlay')) + '</p></div>'; };
      viewer.cleanups.push(() => v.pause());
    } else if (k === 'image' && e !== 'heic') {
      body.innerHTML = '<div class="vcenter"><img class="image-view" alt=""></div>';
      body.querySelector('img').src = url;
    } else if (e === 'txt' || e === 'csv') {
      const text = await file.text();
      body.innerHTML = '<div class="vcenter"><pre class="text-view"></pre></div>';
      body.querySelector('pre').textContent = text;
    }
  }

  function saveCopy() {
    if (!viewer) return;
    const a = document.createElement('a');
    a.href = viewer.urls[0];
    a.download = viewer.item.name;
    document.body.appendChild(a); a.click(); a.remove();
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-action]');
    if (!el) return;
    switch (el.dataset.action) {
      case 'choose': case 'change-folder': changeFolder(); break;
      case 'lock-on': closeSettings(); pinDialog('set').then((ok) => { if (ok) { toast(t('lockedToast')); render(); } }); break;
      case 'lock-off': closeSettings(); pinDialog('check', t('pinRemoveSub')).then((ok) => { if (ok) { ls.del('lock'); toast(t('unlockedToast')); render(); } }); break;
      case 'open-remembered': openRemembered(); break;
      case 'refresh': rescan(true); break;
      case 'lang': setLang(state.lang === 'ar' ? 'en' : 'ar'); ls.set('lang', state.lang); render(); break;
      case 'tab': state.tab = el.dataset.tab; ls.set('tab', state.tab); renderTabs(); renderContent(); break;
      case 'type': state.type = el.dataset.type; renderTabs(); renderContent(); break;
      case 'layout': state.layout = el.dataset.layout; ls.set('layout', state.layout);
        document.querySelectorAll('[data-action="layout"]').forEach((b) => b.setAttribute('aria-pressed', String(b === el))); renderContent(); break;
      case 'open': openItem(el.dataset.id); break;
      case 'close': requestClose(); break;
      case 'new-tab': if (viewer) window.open(viewer.urls[0], '_blank'); break;
      case 'save-copy': saveCopy(); break;
      case 'open-app': openInApp(el.dataset.id); break;
      case 'tip-ok': ls.set('tipOpen', '1'); document.getElementById('tip').innerHTML = ''; break;
      case 'tip-helper-ok': ls.set('tipHelper', '1'); document.getElementById('tip').innerHTML = ''; break;
      case 'settings': openSettings(); break;
      case 'close-settings': closeSettings(); break;
      case 'set-mode': state.openMode = el.dataset.mode; ls.set('openMode', state.openMode); openSettings(); renderContent(); break;
      case 'toggle-helper': state.helper = !state.helper; ls.set('helper', state.helper ? '1' : ''); openSettings(); break;
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && popEl) closeSettings();
    else if (e.key === 'Escape' && viewer) requestClose();
    if (e.key === '/' && state.view === 'main' && !viewer && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); document.getElementById('q').focus(); }
  });
  // New files added to the folder show up when you come back to the page.
  let busy = false;
  async function autoRefresh() {
    const ready = APP ? state.appHasFolder : !!state.root;
    if (busy || !ready || state.view !== 'main' || viewer || Date.now() - state.scannedAt < 15000) return;
    busy = true;
    try { if (APP) await openAppFolder(true); else await openHandle(state.root, true); } finally { busy = false; }
  }
  window.addEventListener('focus', autoRefresh);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') autoRefresh(); });

  /* ---------- Start ---------- */
  setLang(state.lang);
  applyColor();
  (async () => {
    if (APP) { await openAppFolder(); return; }
    if (canRemember) {
      const h = await idbGet('root');
      if (h) {
        state.remembered = h;
        try {
          if ((await h.queryPermission({ mode: 'read' })) === 'granted') { await openHandle(h); return; }
        } catch (e) { /* ask with a click */ }
      }
    }
    render();
  })();
})();
</script>
</body>
</html>
